[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bytetrunc"
version = "1.0.0"
description = "Truncate a string to a maximum number of UTF-8 bytes on a safe character or grapheme boundary, with an optional counted suffix"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "LICENSE-UNICODE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = ["utf-8", "truncate", "bytes", "unicode", "grapheme", "uax29", "utf-16", "filename", "sms"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: General",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
bytetrunc = "bytetrunc._cli:main"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "pytest-timeout", "build", "twine"]

[project.urls]
Homepage = "https://lianes8studio.com"
Source = "https://github.com/JaviLianes8/bytetrunc"
Issues = "https://github.com/JaviLianes8/bytetrunc/issues"
Changelog = "https://github.com/JaviLianes8/bytetrunc/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[tool.hatch.build.targets.sdist]
# Third-party files are fetched locally and never shipped; only their manifests are.
include = [
    "src",
    "tests",
    "scripts/gen_ucd_tables.py",
    "scripts/fetch_upstream.py",
    "data/ucd/MANIFEST.json",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "GUIDE.md",
]
exclude = ["**/__pycache__"]

[tool.hatch.build.targets.wheel]
packages = ["src/bytetrunc"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
timeout = 300
